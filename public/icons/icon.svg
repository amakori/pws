<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#334155" stroke-width="6" />

  <!-- Locker Door Body -->
  <g transform="translate(106, 80)">
    <!-- Main locker frame -->
    <rect x="0" y="0" width="300" height="352" rx="24" fill="#1e293b" stroke="#475569" stroke-width="8" />

    <!-- Locker door vents / louvers -->
    <rect x="50" y="36" width="200" height="8" rx="4" fill="#64748b" />
    <rect x="50" y="56" width="200" height="8" rx="4" fill="#64748b" />
    <rect x="50" y="76" width="200" height="8" rx="4" fill="#64748b" />

    <!-- Center digital badge/display -->
    <rect x="40" y="112" width="220" height="128" rx="16" fill="#0f172a" stroke="url(#primaryGrad)" stroke-width="4" filter="url(#glow)" />
    
    <!-- Lock & Door Symbol inside display -->
    <circle cx="150" cy="160" r="22" fill="none" stroke="#38bdf8" stroke-width="6" />
    <path d="M 140 160 L 140 148 C 140 142 144 138 150 138 C 156 138 160 142 160 148 L 160 160" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
    <circle cx="150" cy="160" r="5" fill="#38bdf8" />
    <path d="M 150 165 L 150 173" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />

    <!-- Status number badge (7 -> 8) -->
    <text x="150" y="218" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="28" fill="#38bdf8" letter-spacing="3">7 ➔ 8</text>

    <!-- Handle -->
    <rect x="240" y="260" width="16" height="50" rx="8" fill="#94a3b8" />
  </g>
</svg>
